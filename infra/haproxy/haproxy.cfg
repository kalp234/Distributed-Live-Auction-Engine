# [T6] HAProxy: HTTP + WebSocket load balancer in front of the 3 stateless app nodes.
global
    log stdout format raw local0 info
    maxconn 4096
    stats socket /tmp/haproxy.sock mode 600 level admin

# Docker's embedded DNS: app containers get a new IP when restarted, so re-resolve.
resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid      2s
    hold other      2s
    hold obsolete   2s

defaults
    mode http
    log global
    option httplog
    option dontlognull
    timeout connect 2s
    timeout client  60s
    timeout server  30s
    timeout tunnel  1h          # long-lived WebSocket connections
    timeout http-request 10s
    # [T2] If a node dies mid-request, retry the request on another node.
    retries 2
    option redispatch
    retry-on conn-failure empty-response

frontend web
    bind :80
    http-response set-header X-LB haproxy
    default_backend apps

backend apps
    balance roundrobin
    # [T6] Active health checks: a node is removed after 2 failed checks (~2 s)
    # and re-added after 2 successful ones. /readyz fails if the node can't reach the DBs.
    option httpchk GET /readyz
    http-check expect status 200
    default-server inter 1s fastinter 500ms downinter 1s fall 2 rise 2 init-addr last,libc,none resolvers docker
    server app1 app1:8000 check
    server app2 app2:8000 check
    server app3 app3:8000 check

listen stats
    bind :8404
    stats enable
    stats uri /stats
    stats refresh 2s
    stats show-legends
