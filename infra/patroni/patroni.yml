# Patroni config template. Node identity (name, scope, addresses, credentials) comes from
# PATRONI_* environment variables set in docker-compose.yml.
restapi:
  listen: 0.0.0.0:8008

etcd3:
  hosts: etcd:2379

bootstrap:
  # Dynamic cluster config stored in etcd (applies to every member).
  dcs:
    # [T3] Leader lease: a dead primary's key expires after ttl seconds -> failover.
    # loop_wait + 2*retry_timeout <= ttl  (2 + 8 <= 10)
    ttl: 10
    loop_wait: 2
    retry_timeout: 4
    maximum_lag_on_failover: 1048576
    # Keep the primary running if etcd itself goes down (all members still reachable).
    failsafe_mode: true
    # [T1] One synchronous standby, the rest async. Patroni only promotes the sync
    # standby, so no acknowledged commit is lost on failover.
    synchronous_mode: true
    synchronous_node_count: 1
    postgresql:
      use_pg_rewind: true        # [T3] old primary rejoins via pg_rewind (no split-brain)
      use_slots: true            # [T1] replication slots per member
      parameters:
        wal_level: replica
        hot_standby: "on"
        max_connections: 200
        max_prepared_transactions: 100   # [T4] required for PREPARE TRANSACTION (2PC)
        max_wal_senders: 10
        max_replication_slots: 10
        wal_keep_size: 256MB
        wal_log_hints: "on"
        synchronous_commit: __SYNC_COMMIT__
        hot_standby_feedback: "on"
        track_commit_timestamp: "on"
        # [T5] Continuous WAL archiving to a volume shared by the shard's members (PITR).
        archive_mode: "on"
        archive_command: "test ! -f /wal_archive/%f && cp %p /wal_archive/%f"
        archive_timeout: 30
        shared_buffers: 64MB
        log_min_duration_statement: -1
        log_line_prefix: "%m [%p] "
  initdb:
    - encoding: UTF8
    - data-checksums
  post_init: /usr/local/bin/post_init.sh

postgresql:
  listen: 0.0.0.0:5432
  data_dir: /data/pgdata
  pgpass: /tmp/pgpass
  parameters:
    unix_socket_directories: /var/run/postgresql
  # Lets a replica (or a rewound ex-primary) fetch WAL it missed from the archive.
  recovery_conf:
    restore_command: "cp /wal_archive/%f %p"
  pg_hba:
    - local all all trust
    - host replication replicator 0.0.0.0/0 scram-sha-256
    - host all all 0.0.0.0/0 scram-sha-256
  basebackup:
    - checkpoint: fast

watchdog:
  mode: off

tags:
  nofailover: false
  noloadbalance: false
  clonefrom: false
  nosync: false
